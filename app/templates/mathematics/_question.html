{% import "_macros.html" as ui %}
<div id="question-slot"
     data-correct="{{ 'true' if feedback and feedback.is_correct else ('false' if feedback else '') }}"
     data-xp="{{ feedback.xp_awarded if feedback else '' }}"
     data-levelup="{{ 'true' if feedback and feedback.leveled_up else 'false' }}"
     data-level="{{ feedback.level_number if feedback else '' }}"
     data-crit="{{ 'true' if feedback and feedback.is_crit else 'false' }}"
     data-loot-name="{{ feedback.crit_item.name if feedback and feedback.crit_item else '' }}"
     data-loot-icon="{{ feedback.crit_item.icon_key if feedback and feedback.crit_item else '' }}"
     data-loot-rarity="{{ feedback.crit_item.rarity if feedback and feedback.crit_item else '' }}"
     data-loot-passive="{{ feedback.crit_item.passive_type if feedback and feedback.crit_item else '' }}"
     data-loot-value="{{ feedback.crit_item.passive_value if feedback and feedback.crit_item else '' }}"
     data-correct-answer="{{ feedback.correct_answer if feedback and not feedback.is_correct else '' }}"
     data-bonus-xp="{{ feedback.bonus_xp if feedback and feedback.bonus_xp else '' }}"
     data-ally-name="{{ feedback.ally_name if feedback and feedback.ally_name else '' }}"
     data-achievements="{{ (feedback.new_achievements | map(attribute='name') | join('||')) if feedback and feedback.new_achievements else '' }}"
     data-needs-review="{{ 'true' if feedback and feedback.needs_review else 'false' }}"
     class="max-w-xl mx-auto space-y-3">

  <div class="w-full bg-black/60 border-2 border-stone-700 rounded-lg p-3 sm:p-4 text-center shadow-inner">
    <p class="text-stone-400 font-medieval text-xs uppercase tracking-widest mb-1">
      <i class="fa-solid fa-book-sparkles mr-1"></i> Desafio
    </p>
    <div class="text-xl sm:text-3xl font-serif text-white font-bold tracking-wide">{{ prompt }}</div>
  </div>

  <form hx-post="{{ url_for('mathematics.answer_question', topic_slug=topic.slug) }}"
        hx-target="#question-slot"
        hx-swap="outerHTML"
        class="w-full">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="token" value="{{ token }}">
    <div class="flex gap-2 sm:gap-3">
      <input type="text" name="answer" inputmode="numeric" autocomplete="off" autofocus
             placeholder="Sua resposta"
             class="w-full bg-stone-800 border-2 border-stone-600 rounded-lg p-2 sm:p-3 text-lg sm:text-2xl text-center text-white font-bold focus:border-purple-500 focus:outline-none transition-colors">
      <button type="submit"
              class="bg-purple-800 text-white border-2 border-purple-400 font-bold px-4 sm:px-6 rounded-lg text-lg sm:text-2xl hover:bg-purple-600 transition-colors shrink-0">
        <i class="fa-solid fa-bolt"></i>
      </button>
    </div>
  </form>
</div>
