{% extends "base.html" %}
{% block title %}{{ topic.name }}{% endblock %}
{% block content %}
<h1>{{ topic.name }}</h1>

<div id="question-slot"
     hx-get="{{ url_for('mathematics.new_question', topic_slug=topic.slug) }}"
     hx-trigger="load"
     hx-swap="outerHTML">
  <div class="panel" style="display:flex;align-items:center;gap:0.75rem;">
    <span class="vfx vfx-loading vfx-inline" aria-hidden="true"></span>
    <p style="margin:0;">Carregando questão...</p>
  </div>
</div>

<p style="margin-top:1rem;">
  <a href="{{ url_for('mathematics.history') }}">Ver histórico de respostas</a>
  · <a href="{{ url_for('mathematics.index') }}">Voltar aos tópicos</a>
</p>
{% endblock %}
